<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Tech Sales Trail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    @property --angle { syntax:"<angle>"; initial-value:0deg; inherits:false; }

    :root{
      --bg:#020617;
      --panel:#0a1730;
      --panel-2:#071324;
      --text:#e9f2ff;
      --muted:#9fb6db;
      --accent:#1f7aff;
      --accent-2:#19a8ff;
      --accent-3:#a855f7;
      --accent-4:#22d3ee;
      --good:#4ade80;
      --warn:#facc15;
      --bad:#fb7185;
      --chip:#0f1e3b;
      --btn:#0e2348;
      --btn-hover:#132e5f;
      --border:#16315a;
      --ink:#bfdbfe;
      --glow:rgba(31,122,255,.45);
      --ease:cubic-bezier(.22,1,.36,1);
      color-scheme:dark;
      box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }
    /* The game is a dark-only experience by design; tokens are identical across schemes. */
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){ --bg:#020617; --panel:#0a1730; --panel-2:#071324; --text:#e9f2ff; }
    }
    :root[data-theme="dark"]{ --bg:#020617; --panel:#0a1730; --panel-2:#071324; --text:#e9f2ff; }
    html{ scroll-padding-top:env(safe-area-inset-top,0px); }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Inter",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      font-size:14px;
      background:
        radial-gradient(1400px 900px at 0% 0%, rgba(31,122,255,0.28) 0, transparent 60%),
        radial-gradient(1300px 900px at 100% 100%, rgba(25,168,255,0.22) 0, transparent 65%),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 8px),
        linear-gradient(135deg,#030617 0,#050b1f 45%,#02030a 100%);
      background-color:var(--bg);
      background-attachment:fixed;
      color:var(--text);
      overflow-x:hidden;
    }

    /* ---------- ambient layers (decor only, never interactive) ---------- */
    .aurora{position:fixed;inset:-20%;pointer-events:none;z-index:0;filter:blur(70px);opacity:.55;mix-blend-mode:screen}
    .aurora i{position:absolute;display:block;width:55vw;height:55vw;border-radius:50%;will-change:transform}
    .aurora .a{top:-8%;left:-12%;background:radial-gradient(circle,rgba(31,122,255,.65),transparent 60%);animation:blobA 22s ease-in-out infinite alternate}
    .aurora .b{bottom:-18%;right:-12%;background:radial-gradient(circle,rgba(168,85,247,.5),transparent 60%);animation:blobB 26s ease-in-out infinite alternate}
    .aurora .c{top:30%;left:35%;width:40vw;height:40vw;background:radial-gradient(circle,rgba(34,211,238,.45),transparent 60%);animation:blobC 30s ease-in-out infinite alternate}
    .gridfloor{
      position:fixed;left:-10%;right:-10%;bottom:-2%;height:42vh;pointer-events:none;z-index:0;opacity:.28;
      background:
        linear-gradient(to top,rgba(25,168,255,.35),transparent 70%),
        repeating-linear-gradient(90deg,rgba(25,168,255,.35) 0 1px,transparent 1px 60px),
        repeating-linear-gradient(0deg,rgba(25,168,255,.35) 0 1px,transparent 1px 40px);
      transform:perspective(600px) rotateX(62deg);
      transform-origin:50% 100%;
      animation:gridScroll 2.2s linear infinite;
      -webkit-mask-image:linear-gradient(to top,#000 20%,transparent 100%);
      mask-image:linear-gradient(to top,#000 20%,transparent 100%);
    }
    .particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .particles span{
      position:absolute;border-radius:50%;
      background:radial-gradient(circle,rgba(25,168,255,.95),rgba(25,168,255,0) 70%);
      animation:floaty linear infinite;opacity:0;will-change:transform,opacity;
    }
    .cursor-glow{
      position:fixed;left:0;top:0;width:320px;height:320px;border-radius:50%;pointer-events:none;z-index:2;
      background:radial-gradient(circle,rgba(31,122,255,.28),transparent 60%);
      mix-blend-mode:screen;filter:blur(18px);opacity:.85;
      transform:translate3d(-999px,-999px,0);transition:transform .12s linear;
    }
    .grain{
      position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.055;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .container{
      position:relative;z-index:1;
      max-width:1400px;
      margin:0 auto;
      padding:10px 10px 12px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:6px;
      animation:cardIn .6s var(--ease) both;
    }
    header .title{
      display:flex;
      align-items:baseline;
      gap:8px;
    }
    header .title h1{
      margin:0;
      font-size:21px;
      letter-spacing:.15px;
      font-family:"Sora","Inter",ui-sans-serif,system-ui,sans-serif;
      font-weight:800;
      display:inline-flex;align-items:center;gap:6px;
    }
    .logo-emoji{display:inline-block;animation:bob 2.8s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(25,168,255,.6))}
    .grad-text{
      background:linear-gradient(90deg,#e9f2ff 0%,#19a8ff 25%,#a855f7 50%,#22d3ee 75%,#e9f2ff 100%);
      background-size:300% 100%;
      -webkit-background-clip:text;background-clip:text;color:transparent;
      animation:shimmerText 6s linear infinite;
      text-shadow:none;
    }
    .chip{
      background:linear-gradient(180deg,var(--chip),#071630);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      color:var(--muted);
      font-size:11px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      position:relative;
      animation:breathe 3.6s ease-in-out infinite;
    }
    .chip strong{color:#e5eeff}
    .row{
      display:flex;
      align-items:center;
      gap:6px;
    }
    .row.wrap{flex-wrap:wrap}
    .row.between{justify-content:space-between}
    .row.right{justify-content:flex-end}
    .grid{
      display:grid;
      grid-template-columns:1.35fr 0.85fr;
      gap:10px;
    }
    @media (max-width:1024px){
      .grid{grid-template-columns:1fr}
    }
    .panel{
      position:relative;
      isolation:isolate;
      background:linear-gradient(180deg,var(--panel),var(--panel-2));
      border-radius:12px;
      border:1px solid var(--border);
      padding:10px;
      box-shadow:0 0 0 1px rgba(255,255,255,0.03) inset,0 10px 30px rgba(0,0,0,0.6);
      --mx:50%;--my:50%;
    }
    .grid>.panel:nth-child(1){animation:cardIn .7s .08s var(--ease) both}
    .grid>.panel:nth-child(2){animation:cardIn .7s .22s var(--ease) both}
    .panel::before{
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
      background:radial-gradient(520px circle at var(--mx) var(--my),rgba(31,122,255,.16),transparent 42%);
      opacity:0;transition:opacity .45s;
    }
    .panel:hover::before{opacity:1}
    .panel::after{
      content:"";position:absolute;inset:-1px;border-radius:13px;padding:1px;pointer-events:none;z-index:0;
      --angle:0deg;
      background:conic-gradient(from var(--angle),transparent 0 55%,var(--accent-2) 72%,var(--accent-3) 84%,transparent 100%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
      animation:spinAngle 7s linear infinite;opacity:.9;
    }
    .panel>*{position:relative;z-index:1}
    h2{
      margin:0 0 8px 0;
      font-size:14px;
      color:#dbe8ff;
      font-family:"Sora","Inter",ui-sans-serif,system-ui,sans-serif;
      font-weight:700;
      letter-spacing:.2px;
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:6px;
    }
    @media (max-width:1200px){
      .stats{grid-template-columns:repeat(3,1fr)}
    }
    .stat{
      background:#071530;
      border-radius:9px;
      border:1px solid var(--border);
      padding:7px 8px;
      min-height:48px;
      display:flex;
      flex-direction:column;
      gap:3px;
      position:relative;overflow:hidden;
      transition:transform .35s var(--ease),box-shadow .35s,border-color .35s;
    }
    .stat::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.055) 50%,transparent 70%);
      background-size:250% 100%;animation:bgDrift 4.5s linear infinite;
    }
    .stat:hover{
      transform:translateY(-2px);
      border-color:#2759c7;
      box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 18px rgba(31,122,255,.28);
    }
    .stat .label{
      font-size:11px;
      color:var(--muted);
      letter-spacing:.2px;
    }
    .stat .value{
      font-size:16px;
      font-weight:600;
      font-variant-numeric:tabular-nums;
      transform-origin:left center;
    }
    .stat .value.pop{animation:pop .45s var(--ease)}
    .stat .sub{
      font-size:11px;
      color:var(--muted);
    }
    .bar{
      width:100%;
      height:5px;
      border-radius:999px;
      background:#050b1c;
      border:1px solid var(--border);
      overflow:hidden;
    }
    .bar>div{
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      position:relative;overflow:hidden;
      transition:width .7s var(--ease);
      box-shadow:0 0 10px var(--glow);
    }
    .bar>div::after{
      content:"";position:absolute;inset:0;
      background:repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px);
      animation:barStripe 1.1s linear infinite;
    }
    .bar.good>div{background:linear-gradient(90deg,var(--good),#22c55e);box-shadow:0 0 10px rgba(74,222,128,.45)}
    .bar.warn>div{background:linear-gradient(90deg,var(--warn),#f97316);box-shadow:0 0 10px rgba(250,204,21,.45)}
    .bar.bad>div{background:linear-gradient(90deg,var(--bad),#ef4444);box-shadow:0 0 12px rgba(251,113,133,.6);animation:barPulse 1.1s ease-in-out infinite}
    .kbd{
      font-size:11px;
      padding:2px 6px;
      border-radius:6px;
      border:1px solid var(--border);
      background:#071530;
      color:var(--muted);
      font-family:ui-monospace,Menlo,Consolas,monospace;
      white-space:nowrap;
      transition:box-shadow .3s,border-color .3s,color .3s,transform .3s var(--ease);
    }
    .kbd:hover{border-color:#2759c7;color:#e5eeff;box-shadow:0 0 12px rgba(31,122,255,.35);transform:translateY(-1px)}
    .pill-btn{
      border-radius:999px;
      border:1px solid var(--border);
      background:#071530;
      color:var(--muted);
      padding:3px 8px;
      font-size:11px;
      cursor:pointer;
      white-space:nowrap;
      font-family:inherit;
      transition:box-shadow .3s,border-color .3s,color .3s,transform .3s var(--ease);
    }
    .pill-btn:hover{
      border-color:#2759c7;
      color:#e5eeff;
      box-shadow:0 0 14px rgba(31,122,255,.4);
      transform:translateY(-1px);
    }
    .badge-row{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .badge{
      font-size:11px;
      padding:4px 7px;
      border-radius:8px;
      background:#0b1a39;
      border:1px solid var(--border);
      color:#c7dbff;
      white-space:nowrap;
      animation:badgeFloat 4s ease-in-out infinite;
      transition:box-shadow .3s,border-color .3s;
    }
    .badge:nth-child(2n){animation-delay:-1.3s}
    .badge:nth-child(3n){animation-delay:-2.4s}
    .badge:hover{border-color:#2759c7;box-shadow:0 0 14px rgba(31,122,255,.35)}
    .tiny{
      font-size:11px;
      color:var(--muted);
    }
    .sep{
      height:1px;
      background:linear-gradient(90deg,transparent,var(--accent-2),var(--accent-3),transparent);
      background-size:200% 100%;
      animation:bgDrift 6s linear infinite;
      margin:8px 0;
      opacity:.7;
    }
    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
    }
    @media (max-width:768px){
      .actions{grid-template-columns:1fr}
    }
    .btn{
      border-radius:9px;
      border:1px solid var(--border);
      background:var(--btn);
      color:var(--text);
      padding:8px 10px;
      font-size:13px;
      text-align:left;
      cursor:pointer;
      display:block;
      width:100%;
      font-family:inherit;
      box-shadow:0 0 0 1px rgba(255,255,255,0.02) inset,0 7px 22px rgba(0,0,0,0.55);
      position:relative;overflow:hidden;
      transition:background .18s,transform .22s var(--ease),box-shadow .25s,border-color .18s;
    }
    .btn::after{
      content:"";position:absolute;top:0;left:-130%;width:60%;height:100%;pointer-events:none;
      background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);
      transform:skewX(-18deg);transition:left .65s var(--ease);
    }
    .btn:hover:not(:disabled)::after{left:150%}
    .actions .btn{
      padding:7px 9px;
    }
    .btn .title{
      font-weight:600;
      font-size:13px;
      margin-bottom:2px;
    }
    .actions .btn .title{
      font-size:12.5px;
      margin-bottom:1px;
    }
    .btn .desc{
      font-size:12px;
      color:var(--muted);
    }
    .actions .btn .desc{
      font-size:11px;
    }
    .btn:hover:not(:disabled){
      background:var(--btn-hover);
      border-color:#2759c7;
      transform:translateY(-2px) scale(1.01);
      box-shadow:0 14px 34px rgba(0,0,0,0.72),0 0 0 1px rgba(39,89,199,.55),0 0 26px rgba(31,122,255,.35);
    }
    .btn:active:not(:disabled){transform:translateY(0) scale(.985)}
    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
      box-shadow:none;
    }
    .btn.primary{
      background:linear-gradient(120deg,#1c3a7a,#122955,#2a4fa8,#1c3a7a);
      background-size:250% 250%;
      border-color:#2850a4;
      animation:pulseRing 2.4s ease-in-out infinite,bgDrift 5s linear infinite;
    }
    .btn.primary:disabled{animation:none}
    .btn.ghost{
      background:transparent;
      border-color:var(--border);
      box-shadow:none;
    }
    .btn.success{
      background:linear-gradient(180deg,#14532d,#052e16);
      border-color:#166534;
    }
    .btn:focus-visible,.pill-btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
    .log{
      height:240px;
      overflow:auto;
      background:#050b1c;
      border-radius:9px;
      border:1px solid var(--border);
      padding:8px;
      font-size:13px;
    }
    .log p{
      margin:0 0 5px 0;
      animation:logIn .35s var(--ease) both;
    }
    .log p:first-child{text-shadow:0 0 14px rgba(31,122,255,.55)}
    .log .muted{
      color:var(--muted);
    }
    .deal-list{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
      max-height:185px;
      overflow-y:auto;
      padding-right:4px;
    }
    @media (max-width:1200px){
      .deal-list{grid-template-columns:1fr}
    }
    .deal{
      background:#050b1c;
      border-radius:9px;
      border:1px solid var(--border);
      padding:7px 8px;
      display:flex;
      flex-direction:column;
      gap:3px;
      animation:cardIn .5s var(--ease) both;
      transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;
    }
    .deal:hover{
      transform:translateY(-2px) scale(1.012);
      border-color:#2759c7;
      box-shadow:0 12px 28px rgba(0,0,0,.6),0 0 20px rgba(31,122,255,.25);
    }
    .deal-header{
      display:flex;
      justify-content:space-between;
      gap:6px;
      align-items:center;
    }
    .deal-title{
      font-size:13px;
      font-weight:600;
    }
    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:3px;
    }
    .pill{
      font-size:11px;
      padding:3px 7px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#071530;
      color:var(--muted);
      white-space:nowrap;
      transition:transform .25s var(--ease),box-shadow .25s;
    }
    .pill:hover{transform:scale(1.06)}
    .pill.stage{color:#cde1ff}
    .pill.value{color:#a5f3fc;text-shadow:0 0 8px rgba(165,243,252,.45)}
    .pill.mood-happy{border-color:var(--good);color:#bbf7d0;animation:moodGood 2.4s ease-in-out infinite}
    .pill.mood-curious{border-color:var(--accent);color:#bae6fd;animation:breathe 3s ease-in-out infinite}
    .pill.mood-neutral{border-color:var(--border);color:var(--muted)}
    .pill.mood-skeptical{border-color:var(--bad);color:#fecaca;animation:moodBad 1.8s ease-in-out infinite}
    .deal-footer{
      display:flex;
      justify-content:space-between;
      font-size:11px;
      color:var(--muted);
      margin-top:2px;
    }
    .footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:6px;
      flex-wrap:wrap;
    }
    .cutbox{
      background:#061737;
      border-radius:10px;
      border:1px solid var(--border);
      padding:8px;
      height:170px;
      overflow:auto;
      font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;
      font-size:11px;
      line-height:1.25;
      color:var(--ink);
      white-space:pre;
      position:relative;
      text-shadow:0 0 8px rgba(31,122,255,.65);
      animation:flicker 5s steps(1,end) infinite;
      box-shadow:inset 0 0 40px rgba(31,122,255,.12);
    }
    .cutbox::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);
    }
    dialog{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      margin:0;
      border-radius:12px;
      border:1px solid var(--border);
      padding:0;
      background:#050b1c;
      color:var(--text);
      width:min(520px,94vw);
      box-shadow:0 18px 42px rgba(0,0,0,0.85),0 0 0 1px rgba(31,122,255,.25),0 0 60px rgba(31,122,255,.18);
    }
    dialog[open]{animation:modalIn .42s cubic-bezier(.2,.9,.3,1.15) both}
    dialog::backdrop{
      background:rgba(3,6,20,0.72);
      backdrop-filter:blur(4px);
      animation:fadeIn .3s both;
    }
    dialog .d-header{
      padding:10px 14px;
      border-bottom:1px solid var(--border);
      font-weight:600;
      font-size:14px;
      font-family:"Sora","Inter",ui-sans-serif,system-ui,sans-serif;
      background:linear-gradient(90deg,rgba(31,122,255,.12),transparent 60%);
    }
    dialog .d-body{
      padding:12px 14px;
    }
    dialog .d-footer{
      padding:8px 14px 10px;
      border-top:1px solid var(--border);
      display:flex;
      justify-content:flex-end;
      gap:6px;
    }
    .cutscene{margin:0;}

    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:#050b1c;border-radius:8px}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent),var(--accent-3));border-radius:8px;border:2px solid #050b1c}

    /* ---------- keyframes ---------- */
    @keyframes spinAngle{to{--angle:360deg}}
    @keyframes shimmerText{0%{background-position:0% 50%}100%{background-position:300% 50%}}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-3px) rotate(8deg)}}
    @keyframes blobA{0%{transform:translate(0,0) scale(1)}100%{transform:translate(18vw,12vh) scale(1.25)}}
    @keyframes blobB{0%{transform:translate(0,0) scale(1.1)}100%{transform:translate(-16vw,-14vh) scale(.9)}}
    @keyframes blobC{0%{transform:translate(-10vw,6vh) scale(.9)}100%{transform:translate(12vw,-10vh) scale(1.2)}}
    @keyframes gridScroll{from{background-position:0 0,0 0,0 0}to{background-position:0 0,0 0,0 40px}}
    @keyframes floaty{0%{transform:translate3d(0,0,0);opacity:0}8%{opacity:.75}92%{opacity:.75}100%{transform:translate3d(var(--dx,0px),-115vh,0);opacity:0}}
    @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(25,168,255,0)}50%{box-shadow:0 0 18px 2px rgba(25,168,255,.38)}}
    @keyframes moodGood{0%,100%{box-shadow:0 0 4px rgba(74,222,128,.2)}50%{box-shadow:0 0 14px rgba(74,222,128,.6)}}

    .cutbox.crt{height:auto;overflow:hidden;padding:10px;border-radius:16px;animation:none;

  <script>
    (function(){
      var reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      var pf=document.getElementById("particles");
      if(pf && !reduced){
        for(var i=0;i<28;i++){
          var s=document.createElement("span");
          var size=(Math.random()*4+2).toFixed(1);
          s.style.left=(Math.random()*100).toFixed(2)+"%";
          s.style.top=(Math.random()*100+20).toFixed(2)+"%";
          s.style.width=size+"px";
          s.style.height=size+"px";
          s.style.animationDuration=(Math.random()*16+14).toFixed(1)+"s";
          s.style.animationDelay=(-Math.random()*30).toFixed(1)+"s";
          s.style.setProperty("--dx",(Math.random()*80-40).toFixed(0)+"px");
          pf.appendChild(s);
        }
      }
      var cursor=document.getElementById("cursor-glow");
      var raf=0,mx=0,my=0;
      document.addEventListener("mousemove",function(e){
        mx=e.clientX;my=e.clientY;
        if(raf)return;
        raf=requestAnimationFrame(function(){
          raf=0;
          if(cursor)cursor.style.transform="translate3d("+(mx-160)+"px,"+(my-160)+"px,0)";
          var panels=document.querySelectorAll(".panel");
          for(var j=0;j<panels.length;j++){
            var r=panels[j].getBoundingClientRect();
            panels[j].style.setProperty("--mx",(mx-r.left)+"px");
            panels[j].style.setProperty("--my",(my-r.top)+"px");
          }
        });
      },{passive:true});
    })();
  </script>

/* ===== Tech Sales Trail v1.14: ASCII scene engine + storyboards (all art drawn for this game) ===== */
(function(root){
  "use strict";
  var HAS_DOM = typeof document !== "undefined";
  var COLS = 64, ROWS = 17, ART = 13; // rows 0-12 art, 13 rule, 14-16 caption band

  /* ---------- helpers ---------- */
  function S(str){ var a = str.split("\n"); if(a[0] === "") a.shift(); if(a.length && a[a.length-1].trim() === "") a.pop(); return a; }
  function clamp(n,a,b){ return n < a ? a : n > b ? b : n; }
  function prog(t,a,b){ return clamp((t-a)/(b-a),0,1); }
  function lerp(a,b,p){ return a+(b-a)*p; }
  function easeOut(p){ return 1-Math.pow(1-p,3); }
  function easeIn(p){ return p*p*p; }
  function blink(t,ms){ return Math.floor(t/ms)%2 === 0; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function rep(ch,n){ var s = ""; for(var i=0;i<n;i++) s += ch; return s; }
  function dots(label,value,width){ var n = Math.max(2,width-label.length-value.length-2); return label+" "+rep(".",n)+" "+value; }

  /* ---------- character grid ---------- */
  function Grid(){ this.n = COLS*ROWS; this.ch = new Array(this.n); this.cl = new Array(this.n); this.clear(); }
  Grid.prototype.clear = function(){ for(var i=0;i<this.n;i++){ this.ch[i] = " "; this.cl[i] = ""; } };
  Grid.prototype.set = function(x,y,c,k){
    x = Math.round(x); y = Math.round(y);
    if(x<0||y<0||x>=COLS||y>=ROWS) return;
    var i = y*COLS+x; this.ch[i] = c; if(k !== undefined) this.cl[i] = k;
  };
  Grid.prototype.get = function(x,y){ x = Math.round(x); y = Math.round(y); if(x<0||y<0||x>=COLS||y>=ROWS) return " "; return this.ch[y*COLS+x]; };
  Grid.prototype.getK = function(x,y){ if(x<0||y<0||x>=COLS||y>=ROWS) return ""; return this.cl[y*COLS+x]; };
  Grid.prototype.text = function(x,y,s,k){ x = Math.round(x); for(var i=0;i<s.length;i++) this.set(x+i,y,s.charAt(i),k); };
  // sprite: spaces are see-through; "§" paints an opaque blank; optional per-char colour mask
  Grid.prototype.spr = function(x,y,lines,k,mask,pal){
    x = Math.round(x); y = Math.round(y);
    for(var r=0;r<lines.length;r++){
      var L = lines[r], M = mask && mask[r];
      for(var i=0;i<L.length;i++){
        var c = L.charAt(i); if(c === " ") continue;
        var kk = k;
        if(M && pal){ var mc = M.charAt(i); if(pal[mc] !== undefined) kk = pal[mc]; }
        this.set(x+i,y+r,c === "§" ? " " : c,kk);
      }
    }
  };
  // solid sprite: blanks between a row's first and last mark are painted, so things behind don't show through
  Grid.prototype.sprO = function(x,y,lines,k){
    x = Math.round(x); y = Math.round(y);
    for(var r=0;r<lines.length;r++){
      var L = lines[r], a = L.search(/\S/), b = L.length-1;
      if(a < 0) continue;
      while(b > a && L.charAt(b) === " ") b--;
      for(var i=a;i<=b;i++) this.set(x+i,y+r,L.charAt(i) === "§" ? " " : L.charAt(i),k);
    }
  };
  Grid.prototype.fill = function(x,y,w,h,c,k){ for(var r=0;r<h;r++) for(var i=0;i<w;i++) this.set(x+i,y+r,c,k); };
  Grid.prototype.center = function(y,s,k){ this.text(Math.floor((COLS-s.length)/2),y,s,k); };
  Grid.prototype.copyFrom = function(o){ for(var i=0;i<this.n;i++){ this.ch[i] = o.ch[i]; this.cl[i] = o.cl[i]; } };
  Grid.prototype.toText = function(){ var out=[]; for(var y=0;y<ROWS;y++) out.push(this.ch.slice(y*COLS,(y+1)*COLS).join("")); return out.join("\n"); };
  Grid.prototype.toHTML = function(){
    var out = "", cur = null, buf = "";
    for(var y=0;y<ROWS;y++){
      for(var x=0;x<COLS;x++){
        var i = y*COLS+x, k = this.cl[i] || "";
        // blanks without their own colour ride along with the current run (fewer spans) unless it paints a background
        if(this.ch[i] === " " && k === "" && cur && cur.indexOf("b-") < 0) k = cur;

    }

  /* ---------- caption band ---------- */
  function caption(g,c,t,dur,run){

    g.text(0,ART,rep("\u2500",COLS),c.rule || "k-d");
    if(t >= c.tTitle || run.still){

    btn.textContent = "Skip"; hint.textContent = "Booting…";
    ctrl = Sc.play(pre,"boot",{maxFont:20, meta:{week:readWeek()}, onDone:function(){ setTimeout(finish, reduced ? 2600 : 1100); }});
  }
  function finish(){
    if(stage === "done") return;
    stage = "done";
    try{ sessionStorage.setItem("tst-booted","1"); }catch(e){}
    ctrl.stop();
    A.play("poweroff");
    document.removeEventListener("keydown",onKey,true);
    document.documentElement.classList.remove("tst-booting");
    if(behind) behind.inert = false;
    if(reduced){ ov.remove(); return; }
    pre.classList.remove("tst-crt-on"); pre.classList.add("tst-crt-off");
    ov.classList.add("off");
    setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },560);
  }
  function advance(){ if(stage === "standby") start(); else if(stage === "booting"){ ctrl.skip(); finish(); } }
  function onKey(e){
    if(stage === "done") return;
    if(e.key === "Tab") return;
    if(e.key === "Escape"){ e.preventDefault(); if(stage === "standby") A.unlock(); finish(); return; }
    if(/^(Shift|Control|Alt|Meta|CapsLock|Arrow|F\d)/.test(e.key)) return;
    e.preventDefault(); e.stopPropagation(); advance();
  }
  ov.addEventListener("click",function(e){ e.stopPropagation(); advance(); });
  document.addEventListener("keydown",onKey,true);
})();

  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

    // v1.14: sound + toast hooks. Everything below is presentation only; game state never reads from these.
    const AUDIO=()=>window.TST_AUDIO||null;
    const sfx=(name,opts)=>{ const a=AUDIO(); if(a) a.play(name,opts); };
    const notify=(msg)=>{ if(window.TST_TOAST) window.TST_TOAST(msg); else alert(msg); };

    const QUARTER_WEEKS = 13;
    const MAX_QUARTERS = 1;

    // Save keys unchanged so existing runs keep loading; legacy keys still read.
    const SAVE_KEY = "tst-save-v4-3";
    const AUTOSAVE_KEY = "tst-autosave-v4-3";
    const LEGACY_KEYS = ["tst-save-v4-2", "tst-autosave-v4-2"];

    const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
    const rand=(a,b)=>Math.random()*(b-a)+a;
    const randi=(a,b)=>Math.floor(rand(a,b+1));
    const choice=(arr)=>arr[Math.floor(Math.random()*arr.length)];
    // FIX: negative cash used to render as "$-1,500".
    const money=(n)=>{const r=Math.round(n);return (r<0?"-$":"$")+Math.abs(r).toLocaleString();};
    const pct=(p)=>Math.round(p*100);
    const now=()=>new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    const idGen=(()=>{let i=0;return()=> (++i).toString(36)+"-"+Date.now().toString(36).slice(-4)})();

    const STAGE_NAMES=["Lead","Qualified","Demoed","Proposal","Closing"];
    const MOODS=["skeptical","neutral","curious","happy"];

    const ACCOUNT_NAMES=[
      "Acme Quantum","NebulaSoft","Feral Unicorn","DataRamen","ByteBazaar","Nimbus Forge",
      "YakStack","HyperLobster","Pinecone Pizza","Mojo Metrics","Slothly AI","Cobalt Circus",
      "Orbit Orchard","Cosmic Bagel","Spicy API","Tesseract Tea","GigaGarden","Marmot Systems",
      "Cronut Cloud","Obsidian Harbor","Parallax Donuts","Velvet Glacier","Ghost Pepper Labs",
      "Mythic Compass","Obelisk Systems","Carbon Jellyfish","Mirrorwave Media","Static Llama",
      "Caffeine Cathedral","Infinite Wasabi","Aurora Churros","Neon Narwhal","Quasar Laundry",
      "Monolith Karaoke","Origami Fortress","Ruby Iguana","Saffron Nebula","Lottery Lagoon",
      "Circuit Sashimi","Helix Orchard","Glacier Lantern","Paper Tiger Rail","Mosaic Marmot",
      "Golem Bistro","Vespertine Motel","Polaris Tacos","Kintsugi Metrics","Chimera Hardware",
      "Murmur Harbor","Lantern Algebra","Cryptic Custard","Midnight Otter","Velvet Switchboard",
      "Oracle Dumpling","Oblique Wombat","Cerulean Vineyard","Signal Pagoda"
    ];

    const getQuarterInfo=(week)=>{
      const quarter=Math.floor((week-1)/QUARTER_WEEKS)+1;
      const weekInQuarter=((week-1)%QUARTER_WEEKS)+1;
      return{quarter,weekInQuarter};
    };

    // FIX: page refresh now resumes the autosave (most recent state); the Load button prefers the manual save.
    const readStoredRun=(preferAutosave=true)=>{
      const keys=preferAutosave
        ?[AUTOSAVE_KEY, SAVE_KEY, ...LEGACY_KEYS]
        :[SAVE_KEY, AUTOSAVE_KEY, ...LEGACY_KEYS];
      for(const k of keys){
        try{
          const v=localStorage.getItem(k);
          if(v) return v;
        }catch{}
      }
      return null;
    };

    // Single merge path for restored runs (was duplicated between initial load and the Load button).
    const mergeSaved=(parsed)=>{
      const base=newGame();
      return{
        ...base,
        ...parsed,
        quota: base.quota, // force current difficulty
        skills:{...base.skills,...(parsed.skills||{})},
        modifiers:{...base.modifiers,...(parsed.modifiers||{})},
        used:{...base.used,...(parsed.used||{})},
        repo:!!parsed.repo,
        repoWarned:!!parsed.repoWarned,
        perfWarnings:Number.isFinite(parsed.perfWarnings)?parsed.perfWarnings:0,
        // v1.15 fields; v1.14 saves don't have them
        coffeesThisWeek:Number.isFinite(parsed.coffeesThisWeek)?Math.max(0,parsed.coffeesThisWeek):0,
        stressWarned:!!parsed.stressWarned,
        hygieneShield:!!parsed.hygieneShield,
        endCause:typeof parsed.endCause==="string"?parsed.endCause:null
      };
    };

    // Clone nested sub-objects that actions mutate, to avoid accidental state mutation bugs.
    const cloneForSpend=(state)=>({
      ...state,
      skills:{...(state.skills||{})},
      modifiers:{...(state.modifiers||{})},
      used:{...(state.used||{})}
    });

    const tickModifiers=(state)=>{
      let s={...state, modifiers:{...(state.modifiers||{conversion:0,discount:0,expiresIn:0})}};
      if((s.modifiers.expiresIn||0)>0){
        s.modifiers.expiresIn-=1;
        if(s.modifiers.expiresIn<=0){
          s.modifiers={conversion:0,discount:0,expiresIn:0};
        }
      }
      return s;
    };

    // Eases a displayed number toward its real value; the real value is never changed.
    const useTween=(target,ms=650)=>{
      const[v,setV]=useState(target);
      const rafRef=useRef(0);
      useEffect(()=>{
        if(REDUCED_MOTION){setV(target);return;}
        const from=v;
        if(from===target)return;
        const start=performance.now();
        cancelAnimationFrame(rafRef.current);
        const step=(t)=>{
          const p=Math.min(1,(t-start)/ms);
          const e=1-Math.pow(1-p,3);
          if(p<1){
            setV(from+(target-from)*e);
            rafRef.current=requestAnimationFrame(step);
          }else{
            setV(target);
          }
        };
        rafRef.current=requestAnimationFrame(step);
        return()=>cancelAnimationFrame(rafRef.current);
      },[target]);
      return v;
    };

    const Stat=({label,value,num,fmt,sub,barValue,barKind})=>{
      const hasNum=typeof num==="number";
      const tv=useTween(hasNum?num:0);
      const display=hasNum ? (fmt?fmt(tv):String(Math.round(tv))) : value;
      let cls="bar";
      if(barKind)cls+=" "+barKind;
      return(
        <div className="stat">
          <div className="label">{label}</div>
          <div className="value pop" key={hasNum?num:value}>{display}</div>
          {sub && <div className="sub">{sub}</div>}
          {typeof barValue==="number" && (
            <div className={cls}>
              <div style={{width:clamp(barValue,0,100)+"%"}}/>
            </div>
          )}
        </div>
      );
    };

    const DealCard=({deal})=>{
      const stageName=STAGE_NAMES[deal.stage]||"Unknown";
      const moodClass="pill mood-"+deal.mood;
      return(
        <div className="deal">
          <div className="deal-header">
            <div className="deal-title">{deal.account}</div>
            <div className="pill-row">
              <span className="pill stage">{stageName}</span>
              <span className={moodClass}>{deal.mood}</span>
            </div>
          </div>
          <div className="deal-footer">
            <span className="pill value">{money(deal.value)}</span>
            <span>Age: {deal.age}w {deal.probNote && <span className="tiny">({deal.probNote})</span>}</span>
          </div>
        </div>
      );
    };

    const Modal=({open,title,children,actions})=>{
      const ref=useRef(null);
      useEffect(()=>{
        if(!ref.current)return;
        if(open){
          if(!ref.current.open)ref.current.showModal();
        }else{
          if(ref.current.open)ref.current.close();
        }
      },[open]);
      return(
        <dialog ref={ref} onCancel={e=>e.preventDefault()}>
          <div className="d-header">{title}</div>
          <div className="d-body">{children}</div>
          <div className="d-footer">
            {actions && actions.map((a,i)=>(
              <button
                key={i}
                className={"btn "+(a.className||"ghost")}
                onClick={a.onClick}
                autoFocus={i===0}
              >
                {a.label}
              </button>
            ))}
          </div>
        </dialog>
      );
    };

    // v1.14: endings play on the ASCII scene engine (plain script above the React tags).
    // The original two-frame flipbook is kept as a fallback if that engine is unavailable.
    const Cutscene=({type,speed,play,meta,ctrlRef})=>{
      const preRef=useRef(null);
      const[fallback,setFallback]=useState(false);
      const[index,setIndex]=useState(0);
      const engine=window.TST_SCENES;
      useEffect(()=>{
        if(!play)return;
        if(!engine||!preRef.current){ setFallback(true); return; }
        let ctrl=null;
        try{ ctrl=engine.play(preRef.current,type,{speed:120/speed,meta:meta||{}}); }
        catch(e){ setFallback(true); return; }
        if(ctrlRef)ctrlRef.current=ctrl;
        return()=>{ try{ctrl.stop();}catch(e){} if(ctrlRef && ctrlRef.current===ctrl)ctrlRef.current=null; };
      },[play,type]);
      useEffect(()=>{ if(ctrlRef && ctrlRef.current)ctrlRef.current.setSpeed(120/speed); },[speed]);
      const frames=CUTSCENES[type]||CUTSCENES.club;
      useEffect(()=>{
        if(!fallback||!play)return;
        setIndex(0);
        let i=0;
        const id=setInterval(()=>{
          i=(i+1)%frames.length;
          setIndex(i);
        },speed);
        return()=>clearInterval(id);
      },[fallback,play,frames,speed]);
      if(fallback || !engine){
        return(
          <div className="cutbox">
            <pre className="cutscene">{frames[index]||""}</pre>
          </div>
        );
      }
      const label=(engine.SCENES[type] && engine.SCENES[type].summary) || "Ending animation";
      return(
        <div className="cutbox crt" role="img" aria-label={label}>
          <pre className="cutscene" ref={preRef}></pre>
        </div>
      );
    };

    const newGame=()=>({
      week:1,
      maxQuarters:MAX_QUARTERS,
      quartersSurvived:0,
      slots:5,
      maxSlots:5,
      restedThisWeek:false,
      energy:95,
      stress:28,
      skills:{prospect:45,discovery:35,demo:30,negotiate:25},
      reputation:40,
      manager:50,
      product:60,
      cash:1200,
      quota:160000,
      closedWon:0,
      closedQuarter:0,
      discounts:0,
      pipeline:0,
      meetings:0,
      deals:[],
      logs:[],
      pip:false,
      pipLevel:0,
      fired:false,
      burnedOut:false,
      win:false,
      missed:false,
      repo:false,
      repoWarned:false,
      modifiers:{conversion:0,discount:0,expiresIn:0},
      achievements:[],
      perfWarnings:0,
      coffeesThisWeek:0,
      stressWarned:false,
      hygieneShield:false,
      endCause:null,
      runId:idGen(),
      used:{
        prospect:false,
        cadence:false,
        discovery:false,
        demo:false,
        propose:false,
        close:false,
        network:false,
        recharge:false,
        crm:false
      }
    });

    const log=(state,msg,kind="info")=>{
      const entry={id:idGen(),t:now(),msg,kind};
      return{...state,logs:[entry,...state.logs].slice(0,220)};
    };

    // v1.15: caffeine and stress can end a run. Numbers tuned with the Monte Carlo sim.
    const isRunOver=(st)=>!!(st.fired||st.burnedOut||st.win||st.missed||st.repo);
    const STRESS_WARN=70;            // 🫀 warning, once per week
    const STRESS_DANGER=80;          // end-of-week burnout roll starts here
    const DANGER_RATE=0.03;          // chance per point above 75
    const CRASH_PER_SHOT=13;         // end-of-week stress per Quad Shot drunk that week
    // n = shots already drunk this week, so these describe the NEXT shot
    const COFFEE_ENERGY=[18,15,12,9,6];
    const coffeeEnergy=(n)=>COFFEE_ENERGY[Math.min(n,COFFEE_ENERGY.length-1)];
    const coffeeStress=(n)=>12+6*n;
    const coffeeRisk=(n)=>n<2?0:n===2?0.20:n===3?0.45:Math.min(0.95,0.75+0.10*(n-4)); // palpitations from shot 3
    const checkBurnout=(state)=>{
      if(!state || isRunOver(state))return state; // an ending already landed; keep its priority
      if(state.stress>=100){
        return log({...state,burnedOut:true,endCause:state.endCause||"stress"},"🧯 Stress 100. Burnout.","bad");
      }
      if(state.stress>=STRESS_WARN && !state.stressWarned){
        return log({...state,stressWarned:true},`🫀 Eye twitch. Stress ${Math.round(state.stress)}.`,"warn");
      }
      return state;
    };

    const addAchievement=(state,key,label)=>{
      if(state.achievements.some(a=>a.key===key))return state;
      const next={...state,achievements:[...state.achievements,{key,label}]};
      return log(next,`🏅 Achievement unlocked: ${label}`);
    };

    const makeDeal=(state,{warm=false,big=false}={})=>{
      const base=big?randi(22000,58000):randi(5000,24000);
      const repMult=0.7+0.6*(state.reputation/100);
      const mood=warm
        ?(Math.random()<0.6?"curious":"neutral")
        :(Math.random()<0.25?"skeptical":"neutral");
      return{
        id:idGen(),
        account:choice(ACCOUNT_NAMES),
        value:Math.round(base*repMult),
        stage:0,
        mood,
        probNote:"",
        age:0
      };
    };

    // High-variance referrals: mostly peanuts, rare whales.
    const makeReferralDeal=(state)=>{
      const roll=Math.random();
      let base=0, note="";
      if(roll<0.70){
        base=randi(2000,11000);
        note="referral peanut";
      }else if(roll<0.90){
        base=randi(9000,26000);
      }else if(roll<0.97){
        base=randi(26000,70000);
        note="referral big";
      }else{
        base=randi(85000,220000);
        note="referral whale";
      }
      const repMult=0.75+0.70*(state.reputation/100);
      return{
        id:idGen(),
        account:choice(ACCOUNT_NAMES),
        value:Math.round(base*repMult),
        stage:0,
        mood:"happy",
        probNote:note,
        age:0
      };
    };

    const checkRepo=(state)=>{
      let s={...state};
      if(s.cash<=-1500 && !s.repo && !s.fired && !s.burnedOut && !s.win && !s.missed){
        s.repo=true;
        s.endCause="repo";
        s=log(s,"🧥 Collections repossessed your President’s Club jacket. That was the last flex you had.","bad");
      }else if(s.cash<=-1000 && !s.repo && !s.repoWarned){
        s.repoWarned=true;
        s=log(s,"⚠️ Cash below -$1,000. Finance is side-eyeing your jacket as collateral.","warn");
      }
      return s;
    };

    // FIX: the old version logged ghosts inside the filter callback, which reassigned `s` mid-expression,
    // so the filtered/aged deal list was written to the OLD state object and thrown away whenever a deal
    // ghosted. Ghosts were announced but never removed and deals never aged on those weeks.
    const ageAndGhost=(state)=>{
      let s={...state};
      const kept=[];
      const ghosts=[];
      for(const d of s.deals){
        const tooOld=d.age>6 && d.stage<2 && Math.random()<0.25;
        const ghosted=d.mood==="skeptical" && Math.random()<0.15;
        if(tooOld||ghosted)ghosts.push(d);
        else kept.push({...d,age:d.age+1});
      }
      s.deals=kept;
      s.pipeline=kept.reduce((sum,d)=>sum+d.value,0);
      for(const g of ghosts){
        s=log(s,`👻 ${g.account} went dark.`,"warn");
      }
      return s;
    };

    const killDeals=(state,predicate,dropProb)=>{
      let s={...state};
      let lost=0,lostVal=0;
      const kept=[];
      for(const d of s.deals){
        if(predicate(d) && Math.random()<dropProb){
          lost++;
          lostVal+=d.value;
        }else kept.push(d);
      }
      s.deals=kept;
      s.pipeline=kept.reduce((sum,d)=>sum+d.value,0);
      if(lost>0){
        s=log(s,`💀 Lost ${lost} deal(s) totaling ${money(lostVal)}.`,"bad");
      }
      return s;
    };

    const tryCloseSome=(state,label="🧾 Negotiations")=>{
      let s={...state};
      const candidates=s.deals.filter(d=>d.stage>=3);
      if(candidates.length===0){
        return log(s,`${label}: nothing ready to close.`,"muted");
      }
      let closedCount=0,totalWon=0,totalDiscount=0,lost=0,lostVal=0;
      const pipPenalty=s.pip ? 0.05*(s.pipLevel||1) : 0;

      const nextDeals=[];
      for(const d of s.deals){
        if(d.stage<3){nextDeals.push(d);continue;}
        let chance=
          0.05 +
          0.26*(s.skills.negotiate/100) +
          0.10*(s.skills.discovery/100) +
          0.07*(s.manager/100) +
          0.08*(s.reputation/100) +
          0.08*(s.product/100) -
          0.20*(s.stress/100) +
          (s.modifiers.conversion||0) +
          (d.stage>=4?0.05:0) +
          (d.mood==="happy"?0.08:0) -
          (d.mood==="skeptical"?0.06:0) -
          pipPenalty;
        chance=clamp(chance,0.03,0.88);
        const roll=Math.random();
        if(roll<chance){
          const rate=s.modifiers.discount||0;
          const net=Math.round(d.value*(1-rate));
          totalWon+=net;
          totalDiscount+=Math.round(d.value*rate);
          closedCount++;
        }else{
          const loseProb=d.stage>=4?0.22:0.14;
          if(Math.random()<loseProb){
            lost++;
            lostVal+=d.value;
          }else{
            let moodIdx=MOODS.indexOf(d.mood);
            if(moodIdx<0)moodIdx=1;
            if(roll>0.9 && moodIdx>0)moodIdx-=1;
            nextDeals.push({
              ...d,
              mood:MOODS[moodIdx],
              probNote:`roll ${pct(roll)}% vs ${pct(chance)}%`
            });
          }
        }
      }
      s.deals=nextDeals;
      s.pipeline=s.deals.reduce((sum,d)=>sum+d.value,0);
      s.closedWon+=totalWon;
      s.closedQuarter+=totalWon;
      s.cash+=Math.round(totalWon*0.12);
      s.discounts+=totalDiscount;

      if(closedCount>0){
        s=log(s,`${label}: closed ${closedCount} deal(s) for ${money(totalWon)}. Commission ${money(totalWon*0.12)}.`);
        if(totalWon>=65000)s=addAchievement(s,"whale","🐋 Whale Hunter");
      }else{
        s=log(s,`${label}: nobody signed. Just vibes and verbal commits.`,"warn");
      }
      if(lost>0){
        s=log(s,`💀 Lost ${lost} late-stage deal(s) worth ${money(lostVal)}.`,"bad");
      }
      s=checkRepo(s);
      return s;
    };

    const randomEvents=(state,setPending,maxFires=2)=>{
      let s={...state};
      let firedCount=0;
      let modalQueued=false;
      const fire=(prob,fn,{modal=false}={})=>{
        if(firedCount>=maxFires)return;
        if(modal && modalQueued)return;
        if(Math.random()<prob){
          s=fn(s);
          firedCount++;
          if(modal)modalQueued=true;
        }
      };

      fire(0.22,st=>{
        const n=randi(2,6);
        const adds=Array.from({length:n},()=>makeDeal(st,{warm:true}));
        st.deals=[...adds,...st.deals];
        st.pipeline=st.deals.reduce((sum,d)=>sum+d.value,0);
        return log(st,`📣 Marketing "SQL Storm": ${n} warm leads landed.`);
      });

      fire(0.18,st=>{
        setPending({
          title:"🧨 Competitor drops a 25% discount",
          body:"Match them and win more but cut ACV, or hold the line and protect brand?",
          options:[
            {
              label:"Match 20% discount (win more, earn less)",
              className:"primary",
              action:(x)=>{
                const baseConv = x.modifiers?.conversion ?? 0;
                x.modifiers={
                  conversion:clamp(baseConv+0.12,-0.30,0.30),
                  discount:0.20,
                  expiresIn:1
                };
                return log(x,"💸 You matched the discount. Win-rate up, ACV down for a week.");
              }
            },
            {
              label:"Hold the line (fewer wins, stronger rep)",
              className:"ghost",
              action:(x)=>{
                const baseConv = x.modifiers?.conversion ?? 0;
                x.reputation=clamp(x.reputation+4,0,100);
                x.modifiers={
                  conversion:clamp(baseConv-0.08,-0.30,0.30),
                  discount:0,
                  expiresIn:1
                };
                return log(x,"🧱 You held pricing. Fewer closes this week; rep nudges up.","warn");
              }
            }
          ]
        });
        return st;
      },{modal:true});

      fire(0.14,st=>{
        const candidate=st.deals.find(d=>d.stage===1||d.stage===2);
        if(!candidate)return st;
        st.product=clamp(st.product-6,0,100);
        st.stress=clamp(st.stress+4,0,100);
        return log(st,`🛠️ SE fumbles a demo for ${candidate.account}. Product -6, stress +4.`,"warn");
      });

      fire(0.12,st=>{
        const candidate=st.deals.find(d=>d.stage>=2);
        if(!candidate)return st;
        st.product=clamp(st.product+8,0,100);
        st.reputation=clamp(st.reputation+3,0,100);
        return log(st,`🧙 SE hero save on ${candidate.account}. Product +8, rep +3.`);
      });

      fire(0.10,st=>{
        setPending({
          title:"🔐 Security Incident",
          body:"A mid-market customer had a breach. Legal wants spin, CS wants transparency.",
          options:[
            {

    const evaluateQuarter=(state)=>{

      let lines=[];

        let fireChance=0.25;
        if(perfQ<0.6)fireChance+=0.25;
        if(s.pip)fireChance+=0.20;
        if(mgr<35)fireChance+=0.20;

        fireChance=clamp(fireChance,0.15,0.95);

        if(roll<fireChance){

        }else{
          if(!s.pip){

            s.pipLevel=1;
            lines.push("You dodge being fired, but land on a PIP. Targets move farther away.");
          }else{
            s.pipLevel=Math.min(2,s.pipLevel+1);
            lines.push("You narrowly avoid termination. PIP escalates to hard mode.");
          }
          s.manager=clamp(s.manager-8,0,100);

      if(!s.fired && perfQ>=1 && mgr<25 && Math.random()<0.06){
        s.fired=true;

      if(!s.fired && s.manager<30 && s.pipeline>0 && Math.random()<0.35){
        const sorted=[...s.deals].sort((a,b)=>b.value-a.value);
        const cut=sorted.slice(0,Math.min(2,sorted.length));
        const cutIds=new Set(cut.map(d=>d.id));

        s.deals=s.deals.filter(d=>{
          if(cutIds.has(d.id)){total+=d.value;return false;}
          return true;
        });
        s.pipeline=s.deals.reduce((sum,d)=>sum+d.value,0);
        lines.push(`Manager “reassigns” ${cut.length} big deal(s) worth ${money(total)}. Setup-to-fail buff applied.`);

      if(!s.fired && s.manager>75 && perfQ<1 && Math.random()<0.5){

          s.win=true;
          s.endCause="club";
          lines.push("Quarter done, number hit. President’s Club ticket punched.");

      let acc=s;
      lines.forEach((line,idx)=>{
        const kind=idx===0?"info":(idx===lines.length-1 && (s.fired||s.burnedOut||s.repo)?"bad":"warn");

      const behind=pace-perfToDate;

      if(!Number.isFinite(ns.perfWarnings)) ns.perfWarnings=0;
      let warnedThisWeek=false;
      // v1.15: a CRM Cleanup this week keeps the warning ladder still and takes the edge off the fire roll.
      const shielded=!!ns.hygieneShield;

      if(shielded){

        ns=log(ns,"👀 Manager asks for a detailed list of every meeting you’ve had this quarter. \"Just for forecasting.\"","warn");
        ns.stress=clamp(ns.stress+4,0,100);
        ns.perfWarnings=1;

      if(ns.manager<20)fireChance+=0.10;
      if(ns.pipeline<ns.quota*0.4)fireChance+=0.05;

      if(!warnedThisWeek && ns.perfWarnings===0) fireChance*=0.6;
      if(shielded) fireChance-=0.06;

        ns.pipeline=ns.deals.reduce((sum,d)=>sum+d.value,0);
        ns=log(ns,pruned>0
          ? `🧹 CRM cleanup. -${pruned} dead lead(s), +${gain} manager.`
          : `🧹 CRM cleanup. Nothing dead. +${gain} manager.`);
        if(nuked)ns=log(ns,`🗑️ "Close that out." ${nuked.account} gone. -${money(nuked.value)}.`,"bad");
        setS(ns);
      };

      const actPolitics=()=>{
        // Internal politics costs more energy now.
        let[ns,ok]=cost(s,{energy:20,slots:1});
        if(!ok)return;
        ns.manager=clamp(ns.manager+8,0,100);
        ns.product=clamp(ns.product+3,0,100);
        ns.reputation=clamp(ns.reputation-4,0,100);
        ns.stress=clamp(ns.stress+2,0,100);
        ns=log(ns,"🏛️ Internal Politics: manager +8, product +3, rep −4. Soul slightly compromised.");
        setS(ns);
      };

      const actConference=()=>{
        let[ns,ok]=cost(s,{energy:40,slots:2});
        if(!ok)return;
        ns.cash-=800;
        const n=randi(3,8);
        const adds=Array.from({length:n},()=>makeDeal(s,{warm:true,big:Math.random()<0.4}));
        ns.deals=[...adds,...ns.deals];
        ns.pipeline=ns.deals.reduce((sum,d)=>sum+d.value,0);
        ns.stress=clamp(ns.stress+5,0,100);
        if(Math.random()<0.30){
          ns.modifiers={
            conversion:(ns.modifiers.conversion||0)+0.08,
            discount:ns.modifiers.discount||0,
            expiresIn:Math.max(1,ns.modifiers.expiresIn||0)
          };
        }
        ns=checkRepo(ns);
        ns=log(ns,`🏟️ Conference Run: -40 energy, -$800 • +${n} leads, possible macro buff.`);
        setS(ns);
      };

      const disabled=(needEnergy,needSlots,usedKey)=>(
        s.energy<needEnergy || s.slots<needSlots || s.fired || s.burnedOut || s.win || s.missed || s.repo ||
        !!(usedKey && s.used && s.used[usedKey])
      );
      const shotsNow=s.coffeesThisWeek||0;
      const nextShotRisk=coffeeRisk(shotsNow);

      return(
        <div className="actions">
          <button className="btn" disabled={disabled(30,1)} onClick={actProspect}>
            <div className="title">📞 Prospect Blitz</div>
            <div className="desc">Find new leads. Cost: 30 Energy • 1 Slot</div>
          </button>
          <button className="btn" disabled={disabled(18,1)} onClick={actCadence}>
            <div className="title">✉️ Email Cadence</div>
            <div className="desc">Warm replies and meetings. Cost: 18 Energy • 1 Slot</div>
          </button>
          <button className="btn" disabled={disabled(22,1)} onClick={actDiscovery}>
            <div className="title">🔎 Discovery Deep Dive</div>
            <div className="desc">Qualify top of funnel. Cost: 22 Energy • 1 Slot</div>
          </button>
          <button className="btn" disabled={disabled(28,1)} onClick={actDemo}>
            <div className="title">🖥️ Demo Marathon</div>
            <div className="desc">Run demos. Cost: 28 Energy • 1 Slot</div>
          </button>
          <button className="btn" disabled={disabled(25,1)} onClick={actPropose}>
            <div className="title">📑 Proposals & Commit</div>
            <div className="desc">Move deals to paper. Cost: 25 Energy • 1 Slot</div>
          </button>
          <button className="btn" disabled={disabled(28,1)} onClick={actClose}>
            <div className="title">🤝 Close Deals</div>
            <div className="desc">Push late-stage opps over the line. Cost: 28 Energy • 1 Slot</div>
          </button>
          <button className="btn" disabled={disabled(16,1)} onClick={actNetwork}>
            <div className="title">🧑‍🤝‍🧑 Referrals & Social</div>
            <div className="desc">High variance: mostly small, sometimes massive. Cost: 16 Energy • 1 Slot</div>
          </button>
          <button className="btn" disabled={disabled(40,2)} onClick={actConference}>
            <div className="title">🏟️ Conference Run</div>
            <div className="desc">Big swing, big leads. Cost: 40 Energy • 2 Slots • $800</div>
          </button>
          <button className="btn" disabled={disabled(0,1)} onClick={actRecharge}>
            <div className="title">🧘 Recharge</div>
            <div className="desc">Once per week. Cost: 1 Slot</div>
          </button>
          <button className="btn" disabled={disabled(0,1)} onClick={actCoffee}>
            <div className="title">☕ Quad Shot</div>
            <div className="desc">Borrow from tomorrow. Cost: 1 Slot • $6 • Stress +{coffeeStress(shotsNow)}{nextShotRisk>0 ? ` • 🫀 ${pct(nextShotRisk)}%` : ""}</div>
          </button>
          <button className="btn" disabled={disabled(20,1)} onClick={actPolitics}>
            <div className="title">🏛️ Internal Politics</div>
            <div className="desc">Buff manager, tax reputation. Cost: 20 Energy • 1 Slot</div>
          </button>
          <button className="btn" disabled={disabled(15,1,"crm")} onClick={actCrm}>
            <div className="title">🧹 CRM Cleanup</div>
            <div className="desc">Prune dead leads, +manager. Risky. Cost: 15 Energy • 1 Slot</div>
          </button>
        </div>
      );
    };

    function Game(){
      const createInitial=()=>{
        const base=newGame();
        try{
          const raw=readStoredRun(true);
          if(!raw)return base;
          return mergeSaved(JSON.parse(raw));
        }catch{ return base; }
      };

      const[s,setS]=useState(createInitial);
      const[pending,setPending]=useState(null);
      const[over,setOver]=useState(null);
      const[asciiSpeed,setAsciiSpeed]=useState(120);
      const[showHelp,setShowHelp]=useState(false);
      const sceneRef=useRef(null);

      // FIX: header buttons were re-bound on every state change. Bind once; read live state through a ref.
      const sRef=useRef(s);
      useEffect(()=>{ sRef.current=s; },[s]);

      useEffect(()=>{
        const ng=document.getElementById("new-game");
        const sv=document.getElementById("save");
        const ld=document.getElementById("load");
        const onNew=()=>{
          const a=AUDIO(); if(a){ a.hush(); a.play("newgame"); a.say("newrun",{cooldown:3000}); }
          setS(newGame());
          setPending(null);
          setOver(null);
        };
        const onSave=()=>{
          try{
            localStorage.setItem(SAVE_KEY,JSON.stringify(sRef.current));
            sfx("save");
            notify("Run saved.");
          }catch{
            sfx("nope");
            notify("Couldn’t save — storage is blocked in this browser.");
          }
        };
        const onLoad=()=>{
          const v=readStoredRun(false);
          if(!v){
            sfx("nope");
            notify("No save found.");
            return;
          }
          try{
            const a=AUDIO(); if(a){ a.hush(); a.play("load"); }
            setS(mergeSaved(JSON.parse(v)));
            setPending(null);
            setOver(null);
          }catch{
            notify("Save was corrupted. Starting a new run.");
            setS(newGame());
            setPending(null);
            setOver(null);
          }
        };
        if(ng)ng.addEventListener("click",onNew);
        if(sv)sv.addEventListener("click",onSave);
        if(ld)ld.addEventListener("click",onLoad);
        return()=>{
          if(ng)ng.removeEventListener("click",onNew);
          if(sv)sv.removeEventListener("click",onSave);
          if(ld)ld.removeEventListener("click",onLoad);
        };
      },[]);

      useEffect(()=>{
        try{
          localStorage.setItem(AUTOSAVE_KEY,JSON.stringify(s));
        }catch{}
      },[s]);

      // v1.14: every new log line maps to a sound (and sometimes a PA line). Reads state only.
      const lastLogRef=useRef(s.logs.length?s.logs[0].id:null);
      useEffect(()=>{
        const prev=lastLogRef.current;
        lastLogRef.current=s.logs.length?s.logs[0].id:null;
        const a=AUDIO(); if(!a)return;
        let fresh;
        if(prev===null){ fresh=s.logs.slice(); }
        else{
          const idx=s.logs.findIndex(e=>e.id===prev);
          if(idx<0)return; // a whole run was swapped in (load / new game)
          fresh=s.logs.slice(0,idx);
        }
        if(fresh.length===0 || fresh.length>40)return;
        a.onLogs(fresh.reverse(),{over:!!(s.fired||s.burnedOut||s.win||s.missed||s.repo)});
      },[s.logs]);
      useEffect(()=>{
        if(!pending || s.fired || s.burnedOut || s.win || s.missed || s.repo)return;
        const a=AUDIO(); if(a) a.onModal(pending.title);
      },[pending]);

      const endWeek=()=>{
        if(s.fired || s.burnedOut || s.win || s.missed || s.repo)return;
        let ns={...s};

        // End-of-week closes still happen with current modifiers.
        if(Math.random()<0.15){
          ns=tryCloseSome(ns,"🕘 End-of-week closes");
        }

        // Tick down existing modifiers BEFORE we potentially apply new ones during this endWeek().
        ns=tickModifiers(ns);

        ns=salaryAndBills(ns);
        ns=randomEvents(ns,setPending,2);
        ns=ageAndGhost(ns);
        ns=checkBurnout(ns);

        const u=ns.used;
        const didProspectish=u.prospect||u.cadence||u.network;
        const didLate=u.propose||u.close;
        const motionsHit=[
          didProspectish,
          u.discovery,
          u.demo,
          didLate
        ].filter(Boolean).length;
        const motionsSkipped=4-motionsHit;

        if(motionsHit>=3){
          ns.modifiers={
            conversion:(ns.modifiers.conversion||0)+0.06,
            discount:ns.modifiers.discount||0,
            expiresIn:Math.max(1,ns.modifiers.expiresIn||0)
          };
          ns=log(ns,"🧩 Coherent week: touched most of the funnel. +6% close next week.");
        }else if(motionsSkipped>=3 && ns.pipeline>0){
          ns.modifiers={
            conversion:(ns.modifiers.conversion||0)-0.06,
            discount:ns.modifiers.discount||0,
            expiresIn:Math.max(1,ns.modifiers.expiresIn||0)
          };
          ns=log(ns,"🪫 Funnel neglect: deals getting weird vibes. −6% close next week.","warn");
        }

        if(!u.discovery && countStage(ns.deals,0)>=6){
          let lost=0;
          ns.deals=ns.deals.filter(d=>{
            if(d.stage===0 && Math.random()<0.20){lost++;return false;}
            return true;
          });
          if(lost>0){
            ns=log(ns,`🥶 Lead decay: ${lost} raw lead(s) went stale.`,"warn");
            ns.pipeline=ns.deals.reduce((sum,d)=>sum+d.value,0);
          }
        }

        if(!u.demo && countStage(ns.deals,1)>=5){
          let reg=0;
          ns.deals=ns.deals.map(d=>{
            if(d.stage===1 && Math.random()<0.18){
              reg++;
              return {...d,stage:0,mood:"skeptical"};
            }
            return d;
          });
          if(reg>0){
            ns=log(ns,`🕑 Demo backlog: ${reg} qualified lead(s) slid back to cold.`,"warn");
            ns.pipeline=ns.deals.reduce((sum,d)=>sum+d.value,0);
          }
        }

        ns.energy=clamp(ns.energy+15,0,100);
        // v1.15: caffeinated weeks crash instead of recovering
        const shots=ns.coffeesThisWeek||0;
        if(shots>0){
          const crash=CRASH_PER_SHOT*shots;
          ns.stress=clamp(ns.stress+crash,0,100);
          ns=log(ns,`🥴 Caffeine crash. Stress +${crash}.`,"warn");
        }else{
          ns.stress=clamp(ns.stress-4,0,100);
        }

        // v1.15: burnout lands before reviews. Danger zone rolls every weekend.
        ns=checkBurnout(ns);
        if(!isRunOver(ns) && ns.stress>=STRESS_DANGER && Math.random()<(ns.stress-75)*DANGER_RATE){
          ns.burnedOut=true;
          ns.endCause="stress";
          ns=log(ns,"🧯 Weekend didn't help. Burnout.","bad");
        }

        ns=checkRepo(ns);

        const perfToDate=ns.quota>0 ? ns.closedQuarter/ns.quota : 0;
        const drift=(perfToDate-0.5)*4;
        ns.manager=clamp(ns.manager+drift,0,100);

        // Email cadence without calling annoys the manager.
        if(ns.used.cadence && !ns.used.prospect){
          ns.manager=clamp(ns.manager-3,0,100);
          ns=log(ns,"📵 Manager feedback: “Good emails. Now pick up the phone.” Manager -3.","warn");
        }

        const {weekInQuarter}=getQuarterInfo(ns.week);

        // Early termination checks never fire on the final week (week 13); QBR handles that.
        if(weekInQuarter>=5 && weekInQuarter<QUARTER_WEEKS && behindPace(ns, weekInQuarter) && !ns.fired && !ns.burnedOut && !ns.repo && !ns.win && !ns.missed){
          ns=midQuarterRisk(ns, weekInQuarter);
          ns=checkBurnout(ns);
        }

        if(weekInQuarter===QUARTER_WEEKS && !ns.fired && !ns.burnedOut && !ns.repo){
          ns=evaluateQuarter(ns);
        }

        if(ns.fired || ns.burnedOut || ns.win || ns.missed || ns.repo){
          setPending(null); // an event queued this week must not stack on the game-over dialog
          setS(ns);
          return;
        }

        const nextWeek=ns.week+1;
        ns=log(ns,`📆 Week advanced to ${nextWeek}.`);
        ns.week=nextWeek;
        ns.slots=ns.maxSlots;
        ns.restedThisWeek=false;
        ns.coffeesThisWeek=0;
        ns.stressWarned=false;
        ns.hygieneShield=false;
        ns.used={
          prospect:false,
          cadence:false,
          discovery:false,
          demo:false,
          propose:false,
          close:false,
          network:false,
          recharge:false,
          crm:false
        };

        setS(ns);
      };

      useEffect(()=>{
        if(s.fired || s.burnedOut || s.win || s.missed || s.repo){
          const type=
            s.repo ? "repo" :
            s.burnedOut ? "burnout" :
            s.win ? "club" :
            s.missed ? "missed" :
            "fired";
          const title=
            type==="club" ? "President’s Club ✨" :
            type==="burnout" ? "Burnout 🧯" :
            type==="missed" ? "Barely Missed 😮‍💨" :
            type==="repo" ? "Jacket Repo’d 🧥" :
            "Terminated 💼";
          const body=
            type==="club"
              ? `Closed ${money(s.closedWon)} this quarter. Number obliterated.`
              : type==="burnout"
                ? `Closed ${money(s.closedWon)} this quarter, but your nervous system liquidated itself.`
                : type==="missed"
                  ? `Closed ${money(s.closedWon)} this quarter. Badge kept; grind continues.`
                  : type==="repo"
                    ? `Cash went deeply negative and collections took your flex piece.`
                    : `Closed ${money(s.closedWon)} before HR reclaimed your dongles.`;
          // v1.15: endCause is set wherever an ending lands; log parsing is only for pre-v1.15 saves
          const legacyCause=()=>{
            if(type!=="fired")return type==="burnout" ? "stress" : type;
            const lastBad=s.logs.find(e=>e.kind==="bad");
            return !lastBad ? "qbr" : lastBad.msg.indexOf("🪓")===0 ? "org" : lastBad.msg.indexOf("📉 Mid-quarter")===0 ? "review" : "qbr";
          };
          const cause=s.endCause || legacyCause();
          const meta={pct:s.quota>0 ? s.closedWon/s.quota : 0, cause};
          setPending(null);
          setOver({title,body,type,meta});
        }else{
          setOver(null);
        }
      },[s.fired,s.burnedOut,s.win,s.missed,s.repo,s.closedWon]);

      // v1.14: heartbeat under the music when stress runs hot
      useEffect(()=>{ const a=AUDIO(); if(a) a.setStress(over ? 0 : s.stress); },[s.stress,over]);

      const {weekInQuarter}=getQuarterInfo(s.week);
      const hasLateDeal = s.deals.some(d=>d.stage>=3);
      const pacePercent=pct(weekInQuarter/QUARTER_WEEKS);

      const tryOpportunisticClose=()=>{
        if(!hasLateDeal){
          setS(log(s,"🧪 No late-stage deals to hail-mary. Manager would just call that LARPing.","warn"));
          return;
        }
        let[ns,ok]=cost(s,{energy:10,slots:1});
        if(!ok)return;
        const miracle=Math.random()<0.2;
        const beforeClosed=ns.closedWon;

        ns=log(
          ns,
          miracle
            ? "🧪 Hail-Mary Close: you carpet-bomb every decision maker with \"last chance\" messages."
            : "🧪 Hail-Mary Close: you press every late-stage deal way past the comfort line.",
          "warn"
        );
        let st=tryCloseSome(ns,"🧪 Hail-Mary Close");
        const closedDelta=st.closedWon-beforeClosed;

        if(miracle){
          if(closedDelta>0){
            st.manager=clamp(st.manager+8,0,100);
            st.stress=clamp(st.stress+4,0,100);
            st=log(st,"🌪️ Against all odds, the chaos campaign lands. Manager +8, Stress +4.");
          }else{
            st.manager=clamp(st.manager-4,0,100);
            st.stress=clamp(st.stress+6,0,100);
            st=log(st,"🤕 Chaos generated noise but no signatures. Manager -4, Stress +6.","bad");
          }
        }else{
          st=killDeals(st,d=>d.stage>=3,0.55);
          st.manager=clamp(st.manager-8,0,100);
          st.stress=clamp(st.stress+8,0,100);
          st.reputation=clamp(st.reputation-4,0,100);
          if(closedDelta<=0){
            st=log(st,"📛 Your reckless push torches late-stage trust. Manager -8, Rep -4, Stress +8.","bad");
          }else{
            st.manager=clamp(st.manager+2,0,100);
            st.reputation=clamp(st.reputation+1,0,100);
            st=log(st,"😬 You closed something, but cooked most of the late-stage pipe. Net Manager -6, Rep -3.","warn");
          }
        }
        st=checkRepo(st);
        st=checkBurnout(st);
        setS(st);
      };

      const opportunisticDisabled=(
        s.slots<=0 || s.fired || s.burnedOut || s.win || s.missed || s.repo || !hasLateDeal
      );

      return(
        <>
          <div className="grid">
            <div className="panel">
              <div className="row between" style={{marginBottom:8}}>
                <h2>Quarter Map</h2>
                <div className="row">
                  <span className="kbd">Week {weekInQuarter}/{QUARTER_WEEKS}</span>
                  <span className="kbd">Turn {s.week}</span>
                  <span className="kbd">Slots {s.slots}/{s.maxSlots}</span>
                  <span className="kbd">Run {s.runId.slice(0,5)}</span>
                  <button className="pill-btn" onClick={()=>setShowHelp(true)}>Stats Help</button>
                </div>
              </div>
              <div className="stats">
                <Stat label="Energy" num={s.energy} fmt={v=>`${Math.round(v)}/100`} barValue={s.energy} barKind={s.energy>50?"good":s.energy>25?"warn":"bad"} />
                <Stat label="Stress" num={s.stress} fmt={v=>`${Math.round(v)}/100`} barValue={s.stress} barKind={s.stress<40?"good":s.stress<70?"warn":"bad"}
                  sub={s.stress>=STRESS_DANGER ? <span style={{color:"var(--bad)"}}>Danger zone</span> : s.stress>=60 ? <span style={{color:"var(--warn)"}}>Edgy</span> : null} />
                <Stat label="Cash" num={s.cash} fmt={money} sub="Salary + commission" />
                <Stat label="Pipeline" num={s.pipeline} fmt={money} sub={`${s.deals.length} live deals`} />
                <Stat label="Closed (Q)" num={s.closedQuarter} fmt={money} sub={`${pct(s.closedQuarter/s.quota)}% of quota • Pace ${pacePercent}%`} />
                <Stat label="Manager" num={s.manager} barValue={s.manager} />
                <Stat label="Prospecting" num={s.skills.prospect} barValue={s.skills.prospect} />
                <Stat label="Discovery" num={s.skills.discovery} barValue={s.skills.discovery} />
                <Stat label="Demo" num={s.skills.demo} barValue={s.skills.demo} />
                <Stat label="Negotiation" num={s.skills.negotiate} barValue={s.skills.negotiate} />
                <Stat label="Reputation" num={s.reputation} barValue={s.reputation} />
                <Stat label="Product" num={s.product} sub="How cursed the stack is" barValue={s.product} />
              </div>
              <div className="sep"></div>
              <Actions s={s} setS={setS} />
              <div className="footer">
                <div className="badge-row">
                  <span className="badge">Total Closed: {money(s.closedWon)}</span>
                  <span className="badge">Quota: {money(s.quota)}</span>
                  {s.pip && <span className="badge">📄 PIP L{(s.pipLevel||1)}</span>}
                  {s.modifiers.discount>0 && <span className="badge">🧾 Discount {pct(s.modifiers.discount)}%</span>}
                  {s.modifiers.conversion!==0 && <span className="badge">🎲 Conv Mod {s.modifiers.conversion>0?"+":""}{pct(s.modifiers.conversion)}%</span>}
                  {s.restedThisWeek && <span className="badge">🧘 Rested</span>}
                  {s.coffeesThisWeek>0 && <span className="badge">☕×{s.coffeesThisWeek}</span>}
                  {s.repo && <span className="badge">🧥 Jacket Repo’d</span>}
                </div>
                <div className="row right">
                  <button
                    className="btn ghost"
                    onClick={tryOpportunisticClose}
                    disabled={opportunisticDisabled}
                  >
                    Hail-Mary Close (10 Energy, 1 Slot, High Risk)
                  </button>
                  <button
                    className="btn primary"
                    onClick={endWeek}
                    disabled={s.fired || s.burnedOut || s.win || s.missed || s.repo}
                  >
                    End Week
                  </button>
                </div>
              </div>
            </div>

            <div className="panel">
              <h2>Active Deals</h2>
              <div className="deal-list">
                {s.deals.length>0 ? (
                  s.deals.map(d=>(
                    <DealCard key={d.id} deal={d} />
                  ))
                ) : (
                  <div className="tiny">No active deals yet. Phone go brr.</div>
                )}
              </div>
              <div className="sep"></div>
              <h2>Activity Log</h2>
              <div className="log">
                {s.logs.length>0 ? (
                  s.logs.map(entry=>(
                    <p key={entry.id}>
                      <span className="muted">{entry.t}</span> — {entry.msg}
                    </p>
                  ))
                ) : (
                  <p className="muted">Logs appear here once you start making noise.</p>
                )}
              </div>
            </div>
          </div>

          <Modal
            open={showHelp}
            title="How This Mess Works"
            actions={[
              {
                label:"Got it",
                className:"primary",
                onClick:()=>setShowHelp(false)
              }
            ]}
          >
            <p className="tiny"><strong>Energy</strong> limits how many big actions you can take each week. Most actions consume it; you get a small refill at week end.</p>
            <p className="tiny"><strong>Stress</strong> reduces your close rates and can trigger burnout at 100. Coffee and chaos raise it; rest and weekends bring it down.</p>
            <p className="tiny"><strong>Cash</strong> comes from salary and commission, but rent and events burn it. Go too negative and collections repo your jacket.</p>
            <p className="tiny"><strong>Pipeline</strong> is total ACV of all active deals. Where they sit in the funnel depends on which actions you run each week.</p>
            <p className="tiny"><strong>Closed (Q)</strong> tracks revenue this quarter. Hitting quota and staying close to the Week/13 pace line keeps you safer from surprise exits.</p>
            <p className="tiny"><strong>Manager</strong> nudges close chance and heavily influences PIPs and firing risk. Emailing without calling can ding it.</p>
            <p className="tiny"><strong>Reputation</strong> helps random events break your way, slightly boosts close rates, and affects how big deals can get.</p>
            <p className="tiny"><strong>Product</strong> reflects how cursed the stack is. Low product makes demos fizzle and prospects defect to competitors.</p>
            <p className="tiny"><strong>Skills</strong> (Prospecting, Discovery, Demo, Negotiation) improve success for their motions and feed into close math.</p>
            <p className="tiny"><strong>Modifiers</strong> like Conversion Mod and Discount are temporary buffs/nerfs from events and coherent weeks.</p>
          </Modal>

          <Modal
            open={!!pending}
            title={pending?.title || "Event"}
            actions={pending ? pending.options.map(opt=>({
              label:opt.label,
              className:opt.className||"ghost",
              onClick:()=>{
                let ns=checkBurnout(opt.action({...s}));
                setS(ns);
                setPending(null);
              }
            })) : []}
          >
            <p className="tiny">{pending?.body}</p>
          </Modal>

          <Modal
            open={!!over}
            title={over?.title || "Game Over"}
            actions={[
              {
                label:"New Run",
                className:"success",
                onClick:()=>{
                  const a=AUDIO(); if(a){ a.hush(); a.play("newgame"); a.say("newrun",{cooldown:3000}); }
                  setS(newGame());
                  setPending(null); // FIX: an event that fired on the final week no longer leaks into the next run
                  setOver(null);
                }
              }
            ]}
          >
            <p className="tiny">{over?.body}</p>
            <Cutscene
              type={over?.type || "club"}
              speed={asciiSpeed}
              play={!!over}
              meta={over?.meta}
              ctrlRef={sceneRef}
            />
            {REDUCED_MOTION && over && window.TST_SCENES && window.TST_SCENES.SCENES[over.type] && (
              <p className="tiny scene-note">{window.TST_SCENES.SCENES[over.type].summary}</p>
            )}
            {!REDUCED_MOTION && window.TST_SCENES && (
              <div className="row right scene-ctl">
                <button className="pill-btn" onClick={()=>{ if(sceneRef.current)sceneRef.current.skip(); }}>Skip to end</button>
                <button className="pill-btn" onClick={()=>{ if(sceneRef.current)sceneRef.current.replay(); }}>Replay</button>
              </div>
            )}
            <div className="row between" style={{marginTop:6}}>
              <div className="badge-row">
                <span className="badge">Total Closed: {money(s.closedWon)}</span>
                <span className="badge">Pipeline: {money(s.pipeline)}</span>
                <span className="badge">Total Discounts: {money(s.discounts)}</span>
              </div>
              <div className="row">
                <span className="tiny">ASCII speed</span>
                <button className="btn ghost" onClick={()=>setAsciiSpeed(p=>Math.max(60,p-20))}>Faster</button>
                <button className="btn ghost" onClick={()=>setAsciiSpeed(p=>Math.min(260,p+20))}>Slower</button>
              </div>
            </div>
          </Modal>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Game />);
  </script>
</body>
</html>
